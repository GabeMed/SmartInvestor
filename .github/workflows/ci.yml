name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Lint + tests (${{ matrix.database }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, postgres]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test -d test"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      DATABASE_URL: ${{ matrix.database == 'postgres' && 'postgres://test:test@localhost:5432/test' || 'sqlite:////tmp/smart_investor.sqlite3' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - name: Django checks
        working-directory: investor_app
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
      - name: Tests (BRAPI and e-mail are mocked)
        working-directory: investor_app
        run: python manage.py test -v 2

  compose:
    name: docker compose smoke test
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up --build --detach --wait
      - name: Demo data is served and the alerts reached Mailpit
        run: |
          curl -sf -H 'Accept: application/json' http://localhost:8000/favorite-assets/ | jq -e '.count == 3'
          curl -sf http://localhost:8025/api/v1/messages | jq -e '.messages_count == 2'
          curl -sf -o /dev/null http://localhost:8000/admin/login/
      - if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down --volumes
